version: 2

models:

  - name: dim_tempo
    description: >
      Dimensão de tempo gerada (5.1), de 2015 a 2035 — 7.670 dias. Gerada e não extraída
      porque dimensão tirada dos fatos só tem os dias em que houve movimento: o mês sem
      venda some do gráfico em vez de aparecer como zero. Feriado móvel é CALCULADO a
      partir da Páscoa, não listado à mão.
    columns:
      - name: data
        description: A chave da dimensão. Um dia, uma linha, sem buraco.
        data_tests: [unique, not_null]
      - name: dia_util
        description: >
          Não é fim de semana e não é feriado. É o que a operação pergunta de verdade
          quando calcula prazo de entrega ou dias de atraso.
        data_tests: [not_null]
      - name: dia_da_semana
        description: >
          ISO: 1 = segunda … 7 = domingo. Explícito porque o `dow` do Postgres começa no
          domingo com 0, e trocar os dois inverte a noção de fim de semana.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5, 6, 7]
      - name: trimestre
        description: >
          1 a 4, do calendário civil. A empresa não usa trimestre fiscal deslocado.
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4]
      - name: e_feriado
        description: >
          Feriado de verdade — nacional, estadual de PE ou municipal do Recife. NÃO inclui ponto facultativo.
        data_tests: [not_null]
      - name: dia_util_operacional
        description: >
          Além de feriado e fim de semana, desconta PONTO FACULTATIVO (Carnaval, Corpus
          Christi). Carnaval e Corpus Christi não são feriado — nem nacional, nem
          municipal no Recife —, mas a cidade para. Empresa privada não é obrigada a
          liberar, então quem consome escolhe entre esta coluna e `dia_util`.
        data_tests: [not_null]
      - name: e_ponto_facultativo
        description: >
          Carnaval e Corpus Christi. Serviço público para, empresa privada decide — por isso é coluna separada de `e_feriado`.
        data_tests: [not_null]
      - name: feriado
        description: >
          Nome do feriado, ou nulo. Inclui os municipais do Recife (Lei 9.777/1967):
          Sexta-feira Santa, 24/06 São João, 16/07 Nossa Senhora do Carmo (padroeira) e
          08/12 Nossa Senhora da Conceição.

  - name: dim_cliente
    description: >
      Dimensão de cliente CONFORME (5.2): a união do cadastro do ERP com os tomadores de
      NFS-e e os sacados de contas. 2.214 identidades, das quais 151 não existem no ERP —
      é o que torna possível perguntar "quanto este cliente comprou de tudo e quanto já
      pagou" sem que 2,8% do faturamento caia em "cliente desconhecido".
      🔒 Concentra PII (documento, nome). Telefone e e-mail ficaram DE FORA de propósito:
      PII de contato sem uso analítico. ⚠️ Falta o acesso restrito por `grants` — depende
      de criar uma role de analista no banco.
    columns:
      - name: sk_cliente
        description: >
          Surrogate key = `md5(chave_cliente)`. Determinística de propósito: `row_number()`
          mudaria a cada build e quebraria fato já gravado com a chave antiga.
        data_tests: [unique, not_null]
      - name: chave_cliente
        description: A chave de negócio — documento em dígitos, ou `sem-documento:<sistema>:<id>`.
        data_tests: [unique, not_null]
      - name: procedencia
        description: De onde esta identidade é conhecida. Rótulo pronto para gráfico.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['cadastrado no ERP', 'so em NFS-e', 'so em contas',
                         'so em NFS-e e contas']
      - name: tipo_documento
        description: >
          cpf ou cnpj, derivado do TAMANHO do documento — não do campo `tipo_pessoa`, que é digitado e pode divergir.
        data_tests:
          - accepted_values:
              arguments:
                values: ['cpf', 'cnpj']
      - name: existe_no_erp
        description: >
          Falso para as 151 identidades que só aparecem em NFS-e ou contas. É o que impede a dimensão de ser uma cópia de `tiny.clientes`.
        data_tests: [not_null]

  - name: dim_produto
    description: >
      Dimensão de produto (5.3): o cadastro de `tiny.estoque` (280) mais os produtos
      ÓRFÃOS que só aparecem em nota (15). Os órfãos não são resíduo — carregam
      perto de 19% do faturamento; uma dimensão só do cadastro deixaria
      esse valor em "produto desconhecido". Na direção oposta, 115 produtos em catálogo
      nunca vendidos entram assim mesmo: produto existe sem ter saído.
      ⚠️ Tipo 1 hoje — o SCD2 é o item 5.4, e o alerta de lá é literal.
    columns:
      - name: sk_produto
        description: >
          `md5(id_produto)`. Determinística: `row_number()` mudaria a cada build e quebraria fato já gravado.
        data_tests: [unique, not_null]
      - name: id_produto
        description: >
          A chave de negócio. `id_produto` e não `codigo`: por id casam 95,1% dos itens,
          por código só 55,5%.
        data_tests: [unique, not_null]
      - name: procedencia
        description: >
          Se veio do cadastro, se é órfão (vendido sem cadastro) ou os dois. Sem isso, 'produto sem preço de custo' parece defeito quando é só órfão.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['cadastrado e vendido', 'em catalogo, nunca vendido',
                         'orfao: vendido sem cadastro']
      - name: situacao
        description: >
          A = ativo, I = inativo, no cadastro do Tiny. NULO em órfão — que não é "situação
          desconhecida", é ausência de cadastro. As duas se parecem num filtro descuidado.
        data_tests:
          - accepted_values:
              arguments:
                values: ['A', 'I']

  - name: dim_vendedor
    description: >
      Vendedor (5.5), Tipo 1, só existe em NF-e. 🔴 74,1% do faturamento
      NÃO tem vendedor atribuído — a pergunta "faturamento por vendedor"
      é respondível sobre um quarto do faturamento, e quem olhar sem esse aviso conclui que
      a equipe vende muito menos do que vende. `id_vendedor = 0` não é vendedor: é "sem
      atribuição" gravado como número, em 6.946 notas.
    columns:
      - name: sk_vendedor
        description: >
          `md5(id_vendedor)`. O membro 'não informado' tem chave própria e estável.
        data_tests: [unique, not_null]
      - name: id_vendedor
        description: >
          Id do Tiny, ou o literal `nao-informado`. ⚠️ O id 0 da origem NÃO entra aqui: é 'sem atribuição' gravado como número, em 6.946 notas.
        data_tests: [unique, not_null]
      - name: nome
        description: >
          Nome normalizado. Os 7 vendedores reais têm id e nome estáveis — nenhum id com dois nomes.
        data_tests: [not_null]
      - name: vendedor_identificado
        description: Falso apenas no membro "sem vendedor atribuido", que faz o total fechar.
        data_tests: [not_null]

  - name: dim_geografia
    description: >
      Geografia (5.6) — conforme, serve aos três fatos. Chave é o par cidade+UF: 9 nomes de
      cidade aparecem em mais de uma UF. Região é `CASE` e não seed porque a divisão do IBGE
      é fato objetivo. ⚠️ `EX` não é UF: é o código fiscal de exterior, e vira
      `regiao = 'exterior'` em vez de ser diluído numa região brasileira (decisão D2).
    columns:
      - name: sk_geografia
        description: >
          `md5(cidade|uf)`. O par, não a cidade sozinha: 9 nomes de cidade se repetem em UFs diferentes.
        data_tests: [unique, not_null]
      - name: regiao
        description: >
          NULO aqui significaria UF que o `CASE` não conhece — por isso `not_null` é
          `error`: é assim que uma UF nova (ou um lixo de duas letras) aparece, em vez de
          sumir num grupo vazio.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['norte', 'nordeste', 'centro-oeste', 'sudeste', 'sul',
                         'exterior', 'nao informada']
      - name: e_pernambuco
        description: >
          A praça da casa. A H&S é de Recife, e 'quanto vendemos fora do estado' é a primeira pergunta diante de um mapa.
        data_tests: [not_null]
      - name: e_exterior
        description: >
          UF `EX`. Exportação conta como venda, mas MARCADA (decisão D2) — nunca diluída numa região brasileira.
        data_tests: [not_null]

  - name: fato_vendas
    description: >
      O fato central (5.7), grão de ITEM DA NOTA. Não decide o que é venda — quem decide é
      `silver.vendas` (4.6). Aqui só se troca chave natural por chave de dimensão.
      ⚠️ `valor_nota_cheio` NÃO existe aqui de propósito: é o valor da nota repetido em cada
      item, e somá-lo inflaria o faturamento em 28%.
    columns:
      - name: sk_venda_item
        description: O item da nota — o grão.
        data_tests: [unique, not_null]
      - name: sk_cliente
        description: >
          Chega pelo `de_para_clientes`, não direto: as 34 notas dos cadastros duplicados apontam para ids que a dimensão não reconhece mais.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_cliente')
                field: sk_cliente
      - name: sk_produto
        description: >
          `not_null` sem exceção: os 2 itens sem `id_produto` da origem não chegam aqui
          porque não são venda. Se um dia chegarem, isto acusa.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_produto')
                field: sk_produto
      - name: sk_geografia
        description: >
          Praça do cliente. 5 itens caem no membro 'não informada' (cliente sem cidade ou sem UF).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_geografia')
                field: sk_geografia
      - name: sk_vendedor
        description: >
          74,1% do faturamento cai no membro 'sem vendedor atribuído' — não é defeito do fato, é ausência na origem.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_vendedor')
                field: sk_vendedor
      - name: data_venda
        description: Liga em `dim_tempo.data`. As 22 notas sem data não são venda e não chegam aqui.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_tempo')
                field: data
      - name: mercado
        description: >
          `interno` ou `externo`. Exportação (CFOP 7xxx) entra como venda, marcada (D2).
        data_tests:
          - accepted_values:
              arguments:
                values: ['interno', 'externo']
      - name: fonte_custo
        description: >
          De onde veio o `custo_unitario`: `centro_custo` (aba, ano da venda),
          `centro_custo_de_outro_ano` (aba, último ano configurado — ver `ano_custo`),
          `cadastro` (`dim_produto`) ou `sem_custo` (`cmv` nulo). Regra no cabeçalho.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['centro_custo', 'centro_custo_de_outro_ano', 'cadastro', 'sem_custo']
      - name: cmv
        description: >
          `quantidade` × `custo_unitario`. Nulo = sem custo (não é zero). Só aduaneiro + o
          aparelho para os carros-chefe: overhead e frete/gás/embalagem já são despesa.
      - name: ano_custo
        description: Ano da configuração do Centro de Custo usada; nulo fora do Centro de Custo.
      - name: linha
        description: >
          Linha de negócio do produto (seed `linha_produto`): aparelho, consumivel ou
          acessorio. Nula = produto sem linha, e `produto_vendido_sem_linha` para o build.

  - name: fato_contas_receber
    description: >
      O segundo fato (5.8), grão de CONTA. Existe para provar o drill across: compartilha
      `dim_cliente` e `dim_geografia` com o `fato_vendas`, então "quanto este cliente
      comprou e quanto já pagou" vira uma consulta. ⚠️ NÃO somar com `fato_vendas` numa
      tabela só — grãos diferentes dupla-contariam faturamento.
    columns:
      - name: sk_conta
        description: >
          O grão: uma linha por conta. NÃO é o grão da nota — uma venda vira várias parcelas.
        data_tests: [unique, not_null]
      - name: id_tiny
        description: >
          Id da conta na origem. ⚠️ Muda quando o financeiro exclui a conta vencida e reemite (ver `excluida_na_origem`).
        data_tests: [unique, not_null]
      - name: sk_cliente
        description: >
          A MESMA chave do `fato_vendas`. As 197 contas sem documento do sacado caem no
          membro "não informado" da dimensão, não em NULL.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_cliente')
                field: sk_cliente
      - name: sk_geografia
        description: >
          Praça do sacado. As contas sem documento caem no membro 'não informada'.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_geografia')
                field: sk_geografia
      - name: data_vencimento
        description: Um dos três papéis da dim_tempo (emissão, vencimento, liquidação).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_tempo')
                field: data
      - name: data_emissao
        description: >
          Um dos três papéis da `dim_tempo`. Responde 'quanto faturei no período' — diferente de vencimento e de liquidação.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_tempo')
                field: data
      - name: em_aberto
        description: >
          Situação `aberto` E não excluída na origem. As 41 excluídas são
          dívida que não existe mais — somá-las em "em aberto" infla o passivo.
        data_tests: [not_null]
      - name: situacao
        description: >
          Estado na origem. ⚠️ `cancelada` aqui é situação da CONTA, não da nota fiscal.
        data_tests:
          - accepted_values:
              arguments:
                values: ['aberto', 'pago', 'parcial', 'cancelada']

  - name: monitor_volume_carga
    description: >
      Monitor de volume (6.4): compara o volume de cada carga com a mediana das execuções
      do mesmo job no mesmo dia da semana. Pega o defeito que termina em sucesso — "hoje
      chegaram 3 notas em vez de 300" —, que nem teste nem `freshness` detectam.
      ⚠️ Filtra dry-run: 11 das 20 execuções registradas em 2026-09-06 eram teste de
      investigação. ⚠️ Com histórico curto devolve `sem base de comparacao` em vez de
      julgar — monitor que erra no começo é desligado antes de ficar útil.
    columns:
      - name: id
        description: >
          Id da execução em `operacao.execucoes_job`.
        data_tests: [unique, not_null]
      - name: veredito
        description: >
          O julgamento. ⚠️ `sem base de comparacao` NÃO é `ok`: significa histórico curto demais para julgar.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['ok', 'sem base de comparacao', 'volume abaixo do normal',
                         'volume MUITO abaixo do normal', 'volume muito acima do normal']

  - name: fato_servicos
    description: >
      O faturamento de serviço (NFS-e), grão de NOTA — a NFS-e não tem itens, tem uma
      discriminação em texto livre, então grão de nota aqui é o grão que o documento tem.
      Ficou fora das Fases 5 e 6 de propósito: o star schema desenhava, mas nenhum
      consumidor pedia. O consumidor apareceu na Fase 9 — o dashboard soma NF-e **mais**
      NFS-e, e um endpoint lendo só `fato_vendas` responderia metade da tela.
      Compartilha `dim_cliente` e `dim_geografia` com os outros dois fatos, então
      "quanto este cliente comprou de produto E de serviço" é uma consulta só.
      ⚠️ NÃO somar com `fato_vendas` numa tabela só — grãos diferentes dupla-contariam.
      ⚠️ Sem produto e sem vendedor: a NFS-e não tem esses campos (ver a matriz de
      barramento). Nota cancelada não entra — regra já decidida na curadoria 4.9 e no
      endpoint da API.
    columns:
      - name: linha
        description: >
          calibracao · plataforma · locacao · servico_tecnico · outro, pela discriminação,
          com o código como apoio e o seed `linha_servico_excecao` por cima. Regra no
          cabeçalho; `linha_origem` diz qual passo decidiu.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['calibracao', 'plataforma', 'locacao', 'servico_tecnico', 'outro']
      - name: sk_servico
        description: "O grão: uma linha por NFS-e não cancelada."
        data_tests: [unique, not_null]
      - name: sk_cliente
        description: >
          A MESMA chave dos outros dois fatos, ligada pelo documento do tomador. Tomador
          sem documento cai no membro "não informado" da dimensão, nunca em NULL — é o que
          impede a linha de sumir num join e o total encolher sem aviso.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_cliente')
                field: sk_cliente
      - name: sk_geografia
        description: >
          Praça do CLIENTE, não a cidade gravada na nota. A nota traz a sua própria, mas
          usar a do cliente é o que faz "faturamento por região" somar igual nos três
          fatos — duas geografias para o mesmo cliente fariam o total por região divergir
          do total geral sem motivo achável.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_geografia')
                field: sk_geografia
      - name: data_servico
        description: Data de emissão da NFS-e. Liga na `dim_tempo` pelo mesmo papel do `fato_vendas`.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_tempo')
                field: data
      - name: numero_nfse
        description: Número da nota na prefeitura. Dimensão degenerada — vive no fato.
      - name: codigo_atividade
        description: >
          Código de atividade municipal, o candidato a separar as LINHAS DE SERVIÇO:
          códigos 62* são TI (Plataforma) e 33* manutenção/calibração. Fica como atributo
          degenerado e não como dimensão, porque o `fato_vendas` também não tem uma e
          criá-la só aqui deixaria a régua de linha de negócio existindo de um lado só.
      - name: tomador_sem_documento
        description: >
          Marca a linha cujo cliente caiu no membro "não informado". Existe para o total
          poder ser auditado sem precisar reproduzir o join.
      - name: valor_servicos
        description: >
          **A métrica de faturamento de serviço.** É esta que soma com o
          `valor_nota_rateado` do `fato_vendas` para dar o faturamento total da empresa.
        data_tests: [not_null]
      - name: valor_iss
        description: ISS da nota. Ao lado do faturamento, na própria coluna.
      - name: valor_deducoes
        description: Deduções da base de cálculo. Ao lado do faturamento, na própria coluna.
      - name: valor_total_recebido
        description: >
          O que de fato entrou, que não é o mesmo que o valor do serviço quando há retenção.

  - name: fato_contas_pagar
    description: >
      A despesa, grão de CONTA — base do `dre_mensal`. Quatro papéis da `dim_tempo`
      (emissão, vencimento, competência, liquidação); o DRE e o Balancete usam a EMISSÃO.
      Linha do DRE pelo plano de contas (`categoria_dre`) e, por cima, pelas exceções
      (`excecoes_contas_pagar`). ⚠️ A exceção muda `linha_dre`/`natureza`, nunca
      `grupo_balancete`. ⚠️ Nada que dependa de "hoje" — atraso corrente e "provisório"
      são ditos na consulta.
    columns:
      - name: sk_conta
        description: "O grão: uma linha por conta viva (não excluída na origem)."
        data_tests: [unique, not_null]
      - name: id_tiny
        data_tests: [unique, not_null]
      - name: data_emissao
        description: >
          A régua do Balancete e do DRE. ⚠️ O financeiro lança com emissão retroativa, então
          mês recente cresce depois de fechado.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_tempo')
                field: data
      - name: data_vencimento
        description: >
          Agenda de caixa, e o mês do DRE da parcela de parcelamento (ver `mes_dre`).
          `warn`: há vencimento em 2066, digitado na origem, fora da `dim_tempo` (2015–2035).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_tempo')
                field: data
              config:
                severity: warn
      - name: data_competencia
        description: >
          A que mês a despesa pertence. Não é a régua do DRE. `warn`: há competência no
          ano 9850 e em 2000, digitação na origem.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_tempo')
                field: data
              config:
                severity: warn
      - name: mes_dre
        description: >
          O mês em que a conta entra no `dre_mensal`: o da EMISSÃO, exceto parcela de
          parcelamento (`parcela_de_parcelamento`), que vai para o do VENCIMENTO. Regra e
          porquê no cabeçalho do modelo. O Balancete continua por `data_emissao`.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_tempo')
                field: data
      - name: parcela_de_parcelamento
        description: >
          Dívida ou imposto num lote (fornecedor + código + emissão) de 2+ contas com alguma
          vencendo mais de 60 dias depois da emissão. Despesa operacional nunca é.
        data_tests: [not_null]
      - name: data_liquidacao
        description: Quando o dinheiro saiu. NULL enquanto em aberto.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_tempo')
                field: data
              config:
                severity: warn
      - name: linha_dre
        description: >
          A linha do DRE. NULL só se a categoria não tiver linha no seed — e aí
          `categoria_do_tiny_sem_linha_no_dre` já derrubou o build.
        data_tests: [not_null]
      - name: natureza
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['operacional', 'imposto_venda', 'imposto_lucro', 'financeiro',
                         'divida', 'dividendo', 'importacao', 'investimento', 'desconsiderada']
      - name: grupo_dre
        description: >
          O grupo em que o `dre_mensal` soma a conta: o `grupo_balancete`, salvo exceção
          com `grupo_dre` no seed (a guia da DCTFWeb, do 8 para o 1).
        data_tests: [not_null]
      - name: fatura_cartao
        description: >
          Fatura do cartão: o código 9.1, ou a reclassificada para `cartao` (paga por
          boleto no Santander em 9.3, mar/2025 a set/2026). É o que `tem_fatura_cartao` lê.
        data_tests: [not_null]
      - name: reclassificada
        description: A linha veio de `excecoes_contas_pagar`, não do plano de contas.
        data_tests: [not_null]
      - name: reclassificacao_confirmada
        description: >
          `false` = reclassificação ainda sem o Financeiro (em 2026-11-19, nenhuma: as
          quatro exceções foram confirmadas). NULL quando a conta não foi reclassificada.
      - name: estado
        data_tests:
          - accepted_values:
              arguments:
                values: ['aberto', 'quitado', 'cancelada']

  - name: dre_mensal
    description: >
      O resultado do mês, uma linha por mês do DRE: o de EMISSÃO (a régua do Balancete da
      tela), exceto parcela de parcelamento de dívida e imposto, que entra no mês do
      VENCIMENTO (`fato_contas_pagar.mes_dre`).
      Receita = `fato_vendas` + `fato_servicos`, as réguas do painel. `balancete_*` existem
      para conferência e reproduzem a tela como ela é. ⚠️ `tem_fatura_cartao = false` =
      despesa subestimada (fatura em 9.1, ou paga por boleto no Santander em 9.3 de mar/2025 a
      set/2026, reclassificada). ⚠️ `despesa_grupo_*` soma por `grupo_dre` (a guia da
      DCTFWeb vai do 8 para o 1); `balancete_*`, por `grupo_balancete`.
      ⚠️ `valor_reclassificado_nao_confirmado` > 0 = o mês depende de decisão do Financeiro.
      ⚠️ "Provisório" (mês corrente e anterior) NÃO está aqui: depende de hoje, é dito na
      consulta. ⚠️ Dívida (amortização) fica FORA do `resultado` (principal não é despesa);
      `resultado_apos_divida` a desconta. ⚠️ Há meses futuros, só com parcelas agendadas:
      `mes_lancado = false`.
    columns:
      - name: mes
        description: Primeiro dia do mês do DRE (`fato_contas_pagar.mes_dre`).
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_tempo')
                field: data
      - name: tem_fatura_cartao
        data_tests: [not_null]
      - name: mes_lancado
        description: >
          Houve venda, serviço ou conta emitida no mês. `false` = mês futuro só com parcelas
          agendadas — não é "o resultado do mês" de ninguém ainda.
        data_tests: [not_null]
      - name: cmv
        description: >
          Custo da mercadoria vendida no mês (`fato_vendas.cmv` por `data_venda`). Só itens
          com custo: o resto está em `receita_produto_sem_custo`. A importação continua
          abaixo da linha — é compra de estoque.
        data_tests: [not_null]
      - name: lucro_bruto
        description: "`receita_liquida` − `cmv`."
        data_tests: [not_null]
      - name: receita_produto_sem_custo
        description: Receita de venda dos itens sem custo nenhum (nem Centro de Custo, nem cadastro).
        data_tests: [not_null]
      - name: cobertura_cmv_pct
        description: >
          Receita de produto com custo ÷ receita de produto, de 0 a 100. Nulo sem venda.
          Abaixo de 100 = `lucro_bruto` superestimado.
      - name: cmv_de_outro_ano
        description: >
          Parte do `cmv` com custo do último ano configurado no Centro de Custo, porque o
          ano da venda não tem configuração. Diferente de zero = custo emprestado, dizer.
        data_tests: [not_null]
      - name: resultado
        description: >
          Lucro bruto − despesa operacional − financeiro − impostos sobre lucro. Desde
          2026-11-19 desconta o CMV. SEM a dívida: amortização de principal não é despesa.
        data_tests: [not_null]
      - name: resultado_apos_divida
        description: "`resultado` − `amortizacao_de_divida`: o que sobra depois de pagar o banco (com o CMV descontado)."
        data_tests: [not_null]
      - name: balancete_sem_impostos
        description: >
          A despesa do Balancete fora os grupos 7 e 8 — o número da âncora. Por EMISSÃO,
          mesmo nas parcelas: é a tela. Conferido mês a
          mês e por grupo em `dre_mensal_reconcilia_com_o_balancete`.
        data_tests: [not_null]

  - name: caixa_semanal
    description: >
      Caixa projetado das próximas 13 semanas (a corrente e mais 12), uma linha por semana,
      para a skill `caixa-projetado` do Midas. Entrega o FLUXO; o saldo inicial é da skill.
      Conhecido (títulos lançados, com a pontualidade e a recuperação medidas) e estimado
      (ritmo) sempre em colunas separadas. ⚠️ O a pagar é lançado depois de pago: a saída é
      quase toda ritmo. ⚠️ Importação só entra se lançada. ⚠️ Depende de `current_date`:
      `data_referencia` diz de quando é. Método no cabeçalho.
    columns:
      - name: semana
        description: 0 = a semana corrente (só da data de referência em diante); 1 a 12, as seguintes.
        data_tests: [unique, not_null]
      - name: entrada_a_vencer
        description: A receber em aberto que vence na semana, pelo valor de face (o `saldo`).
        data_tests: [not_null]
      - name: entrada_conhecida
        description: >
          `entrada_a_vencer_esperada` + `entrada_vencida_esperada`: o que se espera receber
          dos títulos já lançados, com a pontualidade e a recuperação medidas no histórico.
        data_tests: [not_null]
      - name: entrada_estimada
        description: Ritmo de recebimento × `participacao_novos` — só a parte de títulos que ainda não existem.
        data_tests: [not_null]
      - name: saida_conhecida
        description: "`saida_parcelas` + `saida_a_pagar_em_aberto` (sem a importação, que tem coluna própria)."
        data_tests: [not_null]
      - name: saida_estimada
        description: >
          Ritmo de pagamento por chave do plano de contas (26 semanas terminando 9 antes da
          data, por dia do mês), menos o já lançado em aberto da mesma chave e semana.
        data_tests: [not_null]
      - name: fluxo_liquido
        description: "`entrada_total` − `saida_total`."
        data_tests: [not_null]
      - name: fluxo_acumulado
        description: Soma do `fluxo_liquido` da semana 0 até esta. Somar o saldo bancário inicial dá o saldo projetado.
        data_tests: [not_null]
      - name: confianca
        description: "`alta` (entradas e saídas ≥ 70% conhecidas), `media` (entradas ≥ 40%) ou `baixa`."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['alta', 'media', 'baixa']
      - name: erro_tipico_entrada_pct
        description: Erro absoluto médio desta semana do horizonte no backtest, em % do realizado.
      - name: erro_tipico_saida_pct
        description: O mesmo para a saída sem importação, só com semanas de realizado completo.
      - name: fluxo_acumulado_conservador
        description: >
          O acumulado com a entrada e a saída corrigidas pelo viés do backtest, só na
          direção pessimista. Piso para "vamos ter caixa?". Ver o cabeçalho.
        data_tests: [not_null]

  - name: caixa_semanal_backtest
    description: >
      A mesma projeção (macro `caixa_projetado`) rodada como se hoje fosse cada data de
      `origens`, comparada semana a semana com o realizado por `liquidacao`. ⚠️ Só vale o
      erro de saída com `saida_realizada_completa` (o a pagar entra no banco até ~60 dias
      depois de pago) e o de entrada com `entrada_realizada_completa`.
    columns:
      - name: data_referencia
        data_tests: [not_null]
      - name: semana
        data_tests: [not_null]

  - name: margem_por_linha_mensal
    description: >
      Receita, CMV e margem bruta por mês × linha de negócio (produto: aparelho,
      consumivel, acessorio; serviço: calibracao, plataforma, locacao, servico_tecnico,
      outro), para a skill `margem-por-linha` do Midas. Receita bruta, a do `dre_mensal`.
      ⚠️ `margem_bruta_pct` é só sobre a receita COM custo (ver `cobertura_custo_pct`).
      ⚠️ Serviço: cmv/lucro/margem nulos — sem custo direto rastreado; o custo está na
      despesa operacional.
    columns:
      - name: mes
        data_tests: [not_null]
      - name: tipo
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['produto', 'servico']
      - name: linha
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['aparelho', 'consumivel', 'acessorio', 'calibracao', 'plataforma',
                         'locacao', 'servico_tecnico', 'outro']
      - name: margem_bruta_pct
        description: (receita com custo − cmv) ÷ receita com custo. Nulo no serviço.
      - name: cobertura_custo_pct
        description: Receita com custo ÷ receita. 0 no serviço.
